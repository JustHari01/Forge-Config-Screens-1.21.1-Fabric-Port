plugins {
    id 'fabric-loom' version '1.7.4'
}

version = "${mod_version}+${minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-common:${forgeconfigapiport_version}"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand(version: project.version, modVersion: project.version, modName: project.mod_name,
               modAuthor: project.mod_author, modDescription: project.mod_description,
               sourceUrl: project.source_url, issueUrl: project.issue_url)
    }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = "UTF-8" }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
jar { from("LICENSE.md"); from("NOTICE.md") }
